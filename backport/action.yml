name: Backport
description: Backports a commit to the selected release branches
inputs:
  token:
    description: GitHub token with access to all necessary repositories. Required unless both git_push_token and pr_open_token are set.
    required: false
  git_push_token:
    description: GitHub token used to push the backport commits. Needs contents:write (and workflows:write when a backport touches .github/workflows files). Must be set together with pr_open_token, and when set both take precedence over `token`.
    required: false
  pr_open_token:
    description: GitHub token used to open the backport PR, set its labels and comment on failures. Needs pull-requests:write. Must be set together with git_push_token, and when set both take precedence over `token`.
    required: false
  path:
    required: false
    default: "."
  pr_label:
    description: If specified, the backport will only be created for this label
    required: false
  pr_number:
    description: The number of the PR to backport
    required: false
  repo_owner:
    description: The owner of the repository the PR is in
    required: false
  repo_name:
    description: The name of the repository the PR is in
    required: false
  pr_title_template:
    description: Template for backport PR titles. Use {{branch}} and {{title}} placeholders.
    required: false
    default: "[{{branch}}] {{title}}"

runs:
  using: composite
  steps:
    # Build the Go binary from source. Building from source ties the binary
    # 1:1 to the action's pinned commit SHA (a downloaded release asset is
    # mutable). Inlined here rather than extracted into a shared composite
    # because `uses: ./shared` would resolve relative to the consumer's
    # workspace, not this action's directory.
    - id: source-hash
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        files=$(find . -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 \
          | sort -z \
          | xargs -0 sha256sum)
        if [ -z "${files}" ]; then
          echo "source-hash: no Go source files found under $(pwd)" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${files}" | sha256sum | cut -d' ' -f1)
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: /tmp/backport
        key: backport-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-hash.outputs.hash }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        CGO_ENABLED=0 go build -trimpath -o /tmp/backport ./backport
        chmod +x /tmp/backport

    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_GIT_PUSH_TOKEN: ${{ inputs.git_push_token }}
        GITHUB_PR_OPEN_TOKEN: ${{ inputs.pr_open_token }}
        DIR: ${{ inputs.path }}
        PR_LABEL: ${{ inputs.pr_label }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPO_OWNER: ${{ inputs.repo_owner }}
        REPO_NAME: ${{ inputs.repo_name }}
        PR_TITLE_TEMPLATE: ${{ inputs.pr_title_template }}
        BINARY: /tmp/backport
      run: |
        set -euo pipefail
        cd "${DIR}"
        "${BINARY}"

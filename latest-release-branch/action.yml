name: Get latest release branch
description: A simple action that returns the latest release branch given a pattern.
inputs:
  token:
    description: GitHub token with access to all necessary repositories
    required: true
  ownerRepo:
    description: Owner/repo which contains the branch (eg `grafana/grafana`)
    required: true
  pattern:
    description: The pattern to use to search for a release branch (eg `v11.3.x`)
    required: true
outputs:
  branch:
    description: The latest release branch that matches the pattern
    value: ${{ steps.get-latest-release-branch.outputs.branch }}
runs:
  using: composite
  steps:
    # Build the Go binary from source. Building from source ties the binary
    # 1:1 to the action's pinned commit SHA (a downloaded release asset is
    # mutable). Inlined here rather than extracted into a shared composite
    # because `uses: ./shared` would resolve relative to the consumer's
    # workspace, not this action's directory.
    - id: source-hash
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        files=$(find . -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 \
          | sort -z \
          | xargs -0 sha256sum)
        if [ -z "${files}" ]; then
          echo "source-hash: no Go source files found under $(pwd)" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${files}" | sha256sum | cut -d' ' -f1)
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: /tmp/latest-release-branch
        key: latest-release-branch-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-hash.outputs.hash }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        CGO_ENABLED=0 go build -trimpath -o /tmp/latest-release-branch ./latest-release-branch
        chmod +x /tmp/latest-release-branch

    - id: get-latest-release-branch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_OWNERREPO: ${{ inputs.ownerRepo }}
        INPUT_PATTERN: ${{ inputs.pattern }}
        BINARY: /tmp/latest-release-branch
      run: |
        set -euo pipefail
        branch=$("${BINARY}")
        echo "branch=${branch}" >> "$GITHUB_OUTPUT"

name: "CI: Pull request"
on:
  pull_request: {}

jobs:
  pr:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: "${{github.token}}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
      - run: "go run ci/main.go --do-test --do-build"

name: Bump Release Branch
description: Creates a new release branch from an existing release branch
inputs:
  ownerRepo:
    description: Owner/repo which contains the branch (eg `grafana/grafana`)
    required: true
  source:
    description: The existing release branch name. (eg `release-11.3.4`)
    required: true
  token:
    description: GitHub token with access to all necessary repositories
    required: true
outputs:
  branch:
    description: The latest release branch that matches the pattern
    value: ${{ steps.bump-release.outputs.branch }}
runs:
  using: composite
  steps:
    # Build the Go binary from source. Building from source ties the binary
    # 1:1 to the action's pinned commit SHA (a downloaded release asset is
    # mutable). Inlined here rather than extracted into a shared composite
    # because `uses: ./shared` would resolve relative to the consumer's
    # workspace, not this action's directory.
    - id: source-hash
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        files=$(find . -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 \
          | sort -z \
          | xargs -0 sha256sum)
        if [ -z "${files}" ]; then
          echo "source-hash: no Go source files found under $(pwd)" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${files}" | sha256sum | cut -d' ' -f1)
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: /tmp/bump-release
        key: bump-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-hash.outputs.hash }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        CGO_ENABLED=0 go build -trimpath -o /tmp/bump-release ./bump-release
        chmod +x /tmp/bump-release

    - id: bump-release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_OWNERREPO: ${{ inputs.ownerRepo }}
        INPUT_SOURCE: ${{ inputs.source }}
        BINARY: /tmp/bump-release
      run: |
        set -euo pipefail
        branch=$("${BINARY}")
        echo "branch=${branch}" >> "$GITHUB_OUTPUT"

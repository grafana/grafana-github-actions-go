name: Update changelog
description: Generates a changelog for the given version and fits in into the CHANGELOG.md file
inputs:
  version:
    description: Version number invoked from workflow
    required: true
  token:
    description: GitHub token with access to all necessary repositories
    required: true
  metrics_api_key:
    description: API key/password for a Graphite HTTP endpoint
    required: false
  metrics_api_username:
    description: Username for a Graphite HTTP endpoint
    required: false
  metrics_api_endpoint:
    description: Full URL of a Graphite HTTP endpoint
    required: false
  community_api_username:
    required: true
  community_api_key:
    required: true
  community_base_url:
    required: false
    default: "https://community.grafana.com"
  community_category_id:
    required: false
    default: "9"
  skip_pr:
    required: false
    default: "0"
  skip_community_post:
    required: false
    default: "0"
runs:
  using: composite
  steps:
    # Build the Go binary from source. Building from source ties the binary
    # 1:1 to the action's pinned commit SHA (a downloaded release asset is
    # mutable). Inlined here rather than extracted into a shared composite
    # because `uses: ./shared` would resolve relative to the consumer's
    # workspace, not this action's directory.
    - id: source-hash
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        files=$(find . -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 \
          | sort -z \
          | xargs -0 sha256sum)
        if [ -z "${files}" ]; then
          echo "source-hash: no Go source files found under $(pwd)" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${files}" | sha256sum | cut -d' ' -f1)
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: /tmp/update-changelog
        key: update-changelog-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-hash.outputs.hash }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        CGO_ENABLED=0 go build -trimpath -o /tmp/update-changelog ./update-changelog
        chmod +x /tmp/update-changelog

    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_METRICS_API_USERNAME: ${{ inputs.metrics_api_username }}
        INPUT_METRICS_API_KEY: ${{ inputs.metrics_api_key }}
        INPUT_METRICS_API_ENDPOINT: ${{ inputs.metrics_api_endpoint }}
        INPUT_COMMUNITY_API_USERNAME: ${{ inputs.community_api_username }}
        INPUT_COMMUNITY_API_KEY: ${{ inputs.community_api_key }}
        INPUT_COMMUNITY_BASE_URL: ${{ inputs.community_base_url }}
        INPUT_COMMUNITY_CATEGORY_ID: ${{ inputs.community_category_id }}
        INPUT_SKIP_PR: ${{ inputs.skip_pr }}
        INPUT_SKIP_COMMUNITY_POST: ${{ inputs.skip_community_post }}
        BINARY: /tmp/update-changelog
      run: |
        set -euo pipefail
        "${BINARY}"

name: Migrate PRs
description: Migrates PRs from one base branch to another
inputs:
  token:
    description: GitHub token
    required: true
  ownerRepo:
    description: Owner / repo to migrate PRs in. (e.g. 'grafana/grafana')
    required: true
  from:
    description: The base branch to check for open PRs
    required: true
  to:
    description: The base branch to migrate open PRs to
    required: true
runs:
  using: composite
  steps:
    # Build the Go binary from source. Building from source ties the binary
    # 1:1 to the action's pinned commit SHA (a downloaded release asset is
    # mutable). Inlined here rather than extracted into a shared composite
    # because `uses: ./shared` would resolve relative to the consumer's
    # workspace, not this action's directory.
    - id: source-hash
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        files=$(find . -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 \
          | sort -z \
          | xargs -0 sha256sum)
        if [ -z "${files}" ]; then
          echo "source-hash: no Go source files found under $(pwd)" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${files}" | sha256sum | cut -d' ' -f1)
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: /tmp/migrate-open-prs
        key: migrate-open-prs-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-hash.outputs.hash }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        CGO_ENABLED=0 go build -trimpath -o /tmp/migrate-open-prs ./migrate-open-prs
        chmod +x /tmp/migrate-open-prs

    - id: migrate-open-prs
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_OWNERREPO: ${{ inputs.ownerRepo }}
        INPUT_FROM: ${{ inputs.from }}
        INPUT_TO: ${{ inputs.to }}
        BINARY: /tmp/migrate-open-prs
      run: |
        set -euo pipefail
        "${BINARY}"

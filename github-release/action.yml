name: GitHub Release
description: Generates a new release on GitHub for the given version
inputs:
  token:
    description: GitHub token with access to all necessary repositories
    required: true
  version:
    description: The version for which to generate a release
    required: true
  metrics_api_key:
    description: API key/password for a Graphite HTTP endpoint
    required: false
  metrics_api_username:
    description: Username for a Graphite HTTP endpoint
    required: false
  metrics_api_endpoint:
    description: Full URL of a Graphite HTTP endpoint
    required: false
  latest:
    description: Mark the release as latest (1 for latest, 0 for not)
    required: false
  dry_run:
    required: false
    default: false
runs:
  using: composite
  steps:
    # Build the Go binary from source. Building from source ties the binary
    # 1:1 to the action's pinned commit SHA (a downloaded release asset is
    # mutable). Inlined here rather than extracted into a shared composite
    # because `uses: ./shared` would resolve relative to the consumer's
    # workspace, not this action's directory.
    - id: source-hash
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        files=$(find . -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 \
          | sort -z \
          | xargs -0 sha256sum)
        if [ -z "${files}" ]; then
          echo "source-hash: no Go source files found under $(pwd)" >&2
          exit 1
        fi
        hash=$(printf '%s\n' "${files}" | sha256sum | cut -d' ' -f1)
        echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /tmp/github-release
        key: github-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.source-hash.outputs.hash }}

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}/.."
        CGO_ENABLED=0 go build -trimpath -o /tmp/github-release ./github-release
        chmod +x /tmp/github-release

    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_METRICS_API_USERNAME: ${{ inputs.metrics_api_username }}
        INPUT_METRICS_API_KEY: ${{ inputs.metrics_api_key }}
        INPUT_METRICS_API_ENDPOINT: ${{ inputs.metrics_api_endpoint }}
        INPUT_LATEST: ${{ inputs.latest }}
        DRY_RUN: ${{ inputs.dry_run }}
        VERSION: ${{ inputs.version }}
        BINARY: /tmp/github-release
      run: |
        set -euo pipefail
        "${BINARY}" --preview="${DRY_RUN}" "${VERSION}"
